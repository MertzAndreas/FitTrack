name: fittrack

services:
  fittrack:
    image: ${FITTRACK_IMAGE:-ghcr.io/mertzandreas/fittrack:latest}
    container_name: fittrack
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__FitTrack: Data Source=/data/fittrack.db
      FoodData__CsvPath: /seed/OFF.csv.gz
      Storage__UploadsPath: /uploads
    volumes:
      - ./data:/data
      - ./uploads:/uploads
      - ./seed:/seed:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 1h
    labels:
      - com.centurylinklabs.watchtower.enable=true

  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: fittrack-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "60" # Every 60 seconds
