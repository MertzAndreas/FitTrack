services:
  fittrack:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fittrack
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DB_PATH=/data/fittrack.db
    user: "${FITTRACK_UID:-1000}:${FITTRACK_GID:-1000}"
